name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Versions
        run: moon version --all
      - name: Check
        run: moon check --deny-warn
      - name: Build
        run: moon build
      - name: Test
        run: moon test
      - name: Format check
        run: moon fmt --check