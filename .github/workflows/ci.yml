name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Versions
        run: moon version --all
      - name: Check
        run: moon check --deny-warn --target all
      - name: Build
        run: |
          moon build --target wasm
          moon build --target wasm-gc
          moon build --target js
          moon build --target native
      - name: Test
        run: |
          moon test --deny-warn --target wasm
          moon test --deny-warn --target wasm-gc
          moon test --deny-warn --target js
          moon test --deny-warn --target native
      - name: Format check
        run: moon fmt --check
      - name: Generated API is current
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
      - name: Run examples
        run: |
          moon run examples/quickstart
          moon run examples/pallet
          moon run examples/cartonize
          moon run examples/multistop
          moon run examples/hazard
          moon run examples/verify
